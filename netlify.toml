[build]
  command = "npm run build"
  publish = "dist"

# Note: this builds only the static frontend. The app now needs server/ (Express + SQLite)
# running somewhere reachable at /api and /uploads for data to load - Netlify only serves
# static files, so this config alone will show "Could not reach the local server" on a
# deploy. Fine for local use; deploying the backend is a separate concern from this file.

# Redirect all traffic to index.html for SPA routing (React Router or custom routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
