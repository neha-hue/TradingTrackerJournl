[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite inlines VITE_* values into the client bundle by design, which otherwise trips
  # Netlify's secrets scanner and fails the build. Both of these are meant to be public:
  # the Supabase URL, and the publishable anon key that RLS policies are enforced against.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Redirect all traffic to index.html for SPA routing (React Router or custom routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
